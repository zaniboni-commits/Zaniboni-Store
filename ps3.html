<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogos de PS3 — Zaniboni-Store</title>
  <link rel="icon" type="image/png" href="assets/zaniboni-store.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <img src="assets/zaniboni-store.png" alt="Zaniboni-Store">
    <div><div class="logo">ZANIBONI-<span>STORE</span></div><small>JOGOS PARA PS3 E PS2</small></div>
  </div>
  <nav><a href="index.html">Início</a><a href="ps3.html">PS3</a><a href="ps2.html">PS2</a></nav>
</header>
<main class="catalog">
  <a class="back" href="index.html">← Voltar</a>
  <h1>Jogos de PS3</h1>
  <input id="search" class="search" placeholder="🔎 Pesquisar jogo..." oninput="filterGames()">
  <div id="games" class="games">
    <article class="game">
      <div class="cover">PS3</div>
      <div class="game-info">
        <h2>Adicione seu jogo</h2>
        <p>Edite este cartão com o nome, tamanho, capa e link autorizado.</p>
        <span class="pill">PS3</span>
        <span class="pill">PKG</span>
        <a class="download" href="https://SEU-LINK-DE-DOWNLOAD-AQUI" target="_blank" rel="noopener">⬇ Baixar</a>
      </div>
    </article>
  </div>
</main>
<footer>Use somente arquivos e links que você tenha autorização para distribuir.</footer>
<script src="script.js"></script>
</body>
</html>
